<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f6f6f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      width: 100%;
      padding: 1rem;
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 1rem 0;
    }
    .message {
      margin-bottom: .5rem;
      padding: .5rem .75rem;
      background: #eaeaea;
      border-radius: 6px;
    }
    form {
      max-width: 500px;
      width: 100%;
    }
    .flex {
      display: flex;
      gap: .5rem;
      width: 100%;
    }
    input {
      flex: 1;
      padding: .5rem;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      padding: .5rem 1rem;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #005fcc;
    }

    #chat-area {
      display: flex;
      width: 100%;
      max-width: 600px;
      gap: 1rem;
      height: 100%;
      max-height: calc(100vh - 200px);
    }

    #messages {
      flex: 1;
    }

    #mood-wrapper {
      margin-top: 16px;
      margin-bottom: 16px;
      width: 30px;
      flex-grow:1;
      max-width: 30px;
      min-height: 300px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #eee;
      display: flex;
      align-items: flex-end; /* чтобы бар рос снизу */
      padding: 4px;
      box-sizing: border-box;
    }

    #mood-bar {
      width: 100%;
      background: linear-gradient(to top, #ff4500, #ffd000, #00c853);
      border-radius: 4px;
      height: 50%; /* сюда будем подставлять уровень */
      transition: height .3s ease;
    }
  </style>
</head>
<body>
<h1>🍻 AI Собутыльник</h1>

<div id="chat-area">
  <div id="messages"></div>

<!--  <div id="mood-wrapper">-->
<!--    <div id="mood-bar"></div>-->
<!--  </div>-->
</div>

<form id="chat-form">
  <div class="flex">
    <input
      type="range"
      id="temperature"
      min="0"
      max="1"
      step="0.1"
      value="0.5"
      style="width:120px;"
    />
    <span id="temperature-value">0.5</span>
  </div>
  <div class="flex">
    <input id="chat-input" type="text" placeholder="Введите сообщение..." />
    <button type="submit">Отправить</button>
  </div>

</form>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
