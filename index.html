<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f6f6f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      width: 100%;
      max-width: 500px;
      padding: 1rem;
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 1rem 0;
    }
    .message {
      margin-bottom: .5rem;
      padding: .5rem .75rem;
      background: #eaeaea;
      border-radius: 6px;
    }
    form {
      display: flex;
      gap: .5rem;
      width: 100%;
      max-width: 500px;
    }
    input {
      flex: 1;
      padding: .5rem;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      padding: .5rem 1rem;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #005fcc;
    }
  </style>
</head>
<body>
<h1>💬 AI Chat</h1>

<div id="messages"></div>

<form id="chat-form">
  <input id="chat-input" type="text" placeholder="Введите сообщение..." />
  <button type="submit">Отправить</button>
</form>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
